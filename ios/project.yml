name: CybenDefender
options:
  bundleIdPrefix: eu.cyben
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16"
  developmentLanguage: it
  groupSortPosition: top
  transitivelyLinkDependencies: true

targets:
  CybenDefender:
    type: application
    platform: iOS
    deploymentTarget: "16.0"

    sources:
      - path: CybenDefender
        excludes:
          - "**/.DS_Store"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.cyben.guard.ios
        SWIFT_VERSION: "5.0"
        INFOPLIST_FILE: CybenDefender/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: CybenDefender/CybenDefender.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"

    dependencies:
      - sdk: NetworkExtension.framework
      - sdk: CoreLocation.framework
      - sdk: LocalAuthentication.framework
      - sdk: AVFoundation.framework
      - sdk: PhotosUI.framework

    scheme:
      testTargets: []
