name: Android Release Bundle

on:
  push:
    branches: [ "claude/plan-next-steps-aCI19", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > cyben-release.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release Bundle
        id: build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew bundleRelease --no-daemon 2>&1 | tee /tmp/gradle-build.log

      - name: Post error as commit comment
        if: failure()
        run: |
          TAIL=$(tail -80 /tmp/gradle-build.log 2>/dev/null || echo "log non trovato")
          python3 - <<'PYEOF'
import json, subprocess, urllib.request, os
log = open('/tmp/gradle-build.log').read()[-4000:]
body = f"### Build error\n```\n{log}\n```"
data = json.dumps({"body": body}).encode()
req = urllib.request.Request(
    f"https://api.github.com/repos/{os.environ['REPO']}/commits/{os.environ['SHA']}/comments",
    data=data,
    method="POST",
    headers={
        "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
    }
)
try:
    with urllib.request.urlopen(req) as r: print(f"Comment posted: {r.status}")
except Exception as e: print(f"Failed: {e}")
PYEOF
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}

      - name: Upload AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cyben-release-bundle
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
