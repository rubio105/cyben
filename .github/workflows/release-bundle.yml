name: Android Release Bundle

on:
  push:
    branches: [ "claude/plan-next-steps-aCI19", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > cyben-release.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release Bundle + APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon 2>&1 | tee /tmp/gradle-build.log; exit ${PIPESTATUS[0]}

      - name: Post error comment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('/tmp/gradle-build.log', 'utf8').slice(-4000); } catch(e) { log = 'log non disponibile'; }
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '### Build error\n```\n' + log + '\n```'
            });

      - name: Upload AAB (Google Play)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cyben-release-bundle
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload APK (emulatore/test)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cyben-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
