name: Android Release Bundle

on:
  push:
    branches: [ "claude/plan-next-steps-aCI19", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Show Android SDK info
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME/platforms/ 2>/dev/null || echo "no platforms dir"
          ls $ANDROID_HOME/build-tools/ 2>/dev/null || echo "no build-tools dir"

      - name: Install SDK 35 if missing
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            echo "Installo SDK 35..."
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" 2>/dev/null || true
          else
            echo "SDK 35 già presente"
          fi

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > cyben-release.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug (compilation check)
        run: ./gradlew assembleDebug --no-daemon 2>&1 | tail -30

      - name: Build Release Bundle
        id: build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew bundleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log

      - name: Post error as commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAIL=$(grep -E "error:|FAILURE|Exception|e:" /tmp/gradle-build.log 2>/dev/null | head -30 || tail -40 /tmp/gradle-build.log)
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d "$(python3 -c "import json,sys; print(json.dumps({'body': '### Build error\n\`\`\`\n' + open('/dev/stdin').read() + '\n\`\`\`'}))" <<< "$TAIL")"

      - name: Upload AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cyben-release-bundle
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
